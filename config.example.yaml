server:
  name: "ssh-mcp"
  version: "0.1.0"
  default_timeout_sec: 120
  connect_timeout_sec: 10
  max_output_bytes: 1048576
  allow_dangerous: false

hosts:
  - name: "dev-board"
    address: "192.168.1.50"
    port: 22
    user: "pi"
    private_key_path: "~/.ssh/id_ed25519"
    # password: "${SSH_DEV_BOARD_PASSWORD}"
    # proxy_jump: "bastion"
    host_key:
      mode: "known_hosts"
      known_hosts_path: "~/.ssh/known_hosts"
      # Optional: pin host key algorithms if your server only works with one.
      # algorithms: ["ssh-ed25519"]

policy:
  # allow_patterns:
  #   - "^ls "
  # deny_patterns:
  #   - "(?i)rm\\s+-rf"
