name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify release bundles
        env:
          VERSION: v0.0.0-ci
        run: |
          bash scripts/build-release.sh
          cd dist
          sha256sum -c checksums.txt
